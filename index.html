<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clothing Store - Vanilla JS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">Clothify</div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search products..." />
      <select id="category">
        <option value="all">All categories</option>
        <option value="men">Men</option>
        <option value="women">Women</option>
        <option value="kids">Kids</option>
      </select>
      <select id="sort">
        <option value="default">Sort</option>
        <option value="price-asc">Price ↑</option>
        <option value="price-desc">Price ↓</option>
      </select>
      <button id="cart-btn" class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main>
    <section id="products" class="product-grid"></section>
  </main>

  <!-- Product Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" class="close">×</button>
      <img id="modal-img" src="" alt="" />
      <div class="modal-info">
        <h2 id="modal-title"></h2>
        <p id="modal-desc"></p>
        <p class="price" id="modal-price"></p>
        <label>Size
          <select id="modal-size"></select>
        </label>
        <label>Color
          <select id="modal-color"></select>
        </label>
        <div class="modal-actions">
          <input id="modal-qty" type="number" value="1" min="1" />
          <button id="add-to-cart">Add to cart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <aside id="cart-drawer" class="cart-drawer hidden">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button id="close-cart">Close</button>
    </div>
    <ul id="cart-items" class="cart-items"></ul>
    <div class="cart-footer">
      <div>Total: $<span id="cart-total">0.00</span></div>
      <button id="checkout">Checkout (mock)</button>
      <button id="clear-cart" class="danger">Clear</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
